name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build-windows --config Release

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SystemFileManagerX-windows
          path: build-windows/Release/SystemFileManagerX.exe
          if-no-files-found: error